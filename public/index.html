<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Case Watch — Guest Complaint Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Case Watch</h1>
          <p class="subtitle">Guest complaint &amp; reimbursement tracker</p>
        </div>
      </div>
      <div class="sync-status" id="syncStatus" role="status">Checking last sync…</div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-block">
          <label class="sidebar-label" for="monthFilter">Month</label>
          <select id="monthFilter" class="month-select">
            <option value="all">All time</option>
          </select>
        </div>

        <div class="sidebar-block">
          <span class="sidebar-label">Severity</span>
          <div class="filter-chips" id="filterChips" role="group" aria-label="Filter by severity">
            <button class="chip active" data-filter="all" aria-pressed="true" type="button">
              All cases<span class="chip-count" data-count-for="all"></span>
            </button>
            <button class="chip" data-filter="high" aria-pressed="false" type="button">
              <span class="dot high" aria-hidden="true"></span>Worst<span class="chip-count" data-count-for="high"></span>
            </button>
            <button class="chip" data-filter="medium" aria-pressed="false" type="button">
              <span class="dot medium" aria-hidden="true"></span>Needs attention<span class="chip-count" data-count-for="medium"></span>
            </button>
            <button class="chip" data-filter="low" aria-pressed="false" type="button">
              <span class="dot low" aria-hidden="true"></span>Good<span class="chip-count" data-count-for="low"></span>
            </button>
          </div>
        </div>
      </aside>

      <main class="content">
        <section class="leaderboard" aria-label="Store leaderboard">
          <div class="leaderboard-head">
            <h2>Store Watch</h2>
            <span class="leaderboard-hint">Ranked by open case severity</span>
          </div>
          <div class="leaderboard-list" id="leaderboardList"></div>
        </section>

        <section class="controls">
          <div class="search-wrap">
            <input type="search" id="searchInput" aria-label="Search by case, store, or customer" placeholder="Search by case, store, or customer…" />
          </div>
        </section>

        <section class="case-list" id="caseList" aria-label="Case list"></section>
        <p class="empty-state" id="emptyState" hidden>No cases match these filters.</p>
      </main>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
